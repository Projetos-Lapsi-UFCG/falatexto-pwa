<div class="create-wrapper min-h-screen bg-neutral-50 p-6">
  <div [@fadeIn] class="create-inner">

    <!-- Back button -->
    <button mat-button (click)="goBack()" class="back-btn">
      <ng-icon name="lucideArrowLeft" size="16" />
      {{ 'CREATE_FORM.BACK' | translate }}
    </button>

    <!-- Form card -->
    <div [@scaleIn] class="create-card">
      <div class="create-header">
        <h2 class="create-title">{{ 'CREATE_FORM.TITLE' | translate }}</h2>
        <p class="create-subtitle">{{ 'CREATE_FORM.SUBTITLE' | translate }}</p>
      </div>

      <form [formGroup]="createForm" (ngSubmit)="handleSubmit()" class="create-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'CREATE_FORM.NAME_LABEL' | translate }}</mat-label>
          <input matInput formControlName="name" [placeholder]="'CREATE_FORM.NAME_PLACEHOLDER' | translate" />
          @if (createForm.get('name')?.invalid && createForm.get('name')?.dirty) {
            <mat-error>{{ 'CREATE_FORM.NAME_ERROR' | translate }}</mat-error>
          }
        </mat-form-field>

        <div class="form-actions">
          <button mat-stroked-button type="button" (click)="goBack()" class="cancel-btn" [disabled]="loading">
            {{ 'CREATE_FORM.CANCEL' | translate }}
          </button>
          <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="loading">
            <ng-icon name="lucidePlus" size="16" />
            {{ 'CREATE_FORM.SUBMIT' | translate }}
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
