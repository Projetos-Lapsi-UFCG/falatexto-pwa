<mat-card class="submission-row">
  <mat-card-content class="submission-row-content">
    <span class="col-form">{{ submission.formName }}</span>
    <span class="col-date">{{ formatDateTime(submission.submittedAt) }}</span>
    <span class="col-responsible">{{ submission.responsible }}</span>
  </mat-card-content>
</mat-card>
