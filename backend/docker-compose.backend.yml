services:
  database:
    image: mongo:latest
    container_name: assis_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: assis_db
    volumes:
      - ./scripts/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
      - mongo_data:/data/db
    networks:
      - falatexto-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: assis_api
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - database
    environment:
      MONGO_URI: mongodb://database:27017
      MONGO_DB_NAME: assis_db
    networks:
      - falatexto-network

  vision-engine:
    build: ./vision-engine
    container_name: assis_vision_engine
    ports:
      - "8001:8001"
    depends_on:
      - database
    environment:
      MONGO_URI: mongodb://database:27017
      MONGO_DB_NAME: assis_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - falatexto-network

volumes:
  mongo_data:

networks:
  falatexto-network:
    driver: bridge