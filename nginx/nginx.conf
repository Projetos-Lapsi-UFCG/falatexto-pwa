worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format detailed '$remote_addr | $http_x_forwarded_for | [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log detailed;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host             $host;

        # Frontend (Angular PWA)
        location / {
            proxy_pass http://assis_frontend:80;
        }

        # Ditado em tempo real: WebSocket direto ao Vision Engine
        location = /api/v1/vision/transcrever-stream {
            proxy_pass http://vision-engine:8001/ws/transcrever;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://api:8000;
        }
    }
}
