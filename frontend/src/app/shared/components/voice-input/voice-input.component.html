<button
  mat-icon-button
  type="button"
  [class.recording]="state === 'recording'"
  [class.transcribing]="state === 'transcribing'"
  [disabled]="state === 'transcribing'"
  [matTooltip]="tooltipKey | translate"
  [attr.aria-label]="tooltipKey | translate"
  [attr.aria-pressed]="state === 'recording'"
  (click)="toggle()"
>
  @switch (state) {
    @case ('recording') {
      <ng-icon name="lucideMicOff" size="18" />
    }
    @case ('transcribing') {
      <ng-icon name="lucideLoaderCircle" size="18" class="spin-icon" />
    }
    @default {
      <ng-icon name="lucideMic" size="18" />
    }
  }
</button>
