services:
  database:
    image: mongo:latest
    container_name: assis_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: assis_db
    volumes:
      - ./backend/scripts/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
      - mongo_data:/data/db
    networks:
      - falatexto-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "printjson(db.adminCommand({ping:1}))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:0.24.0
    container_name: assis_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - falatexto-network

  vision-engine:
    build:
      context: ./backend/vision-engine
      dockerfile: Dockerfile
    container_name: assis_vision_engine
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - database
      - ollama
    environment:
      MONGO_URI: mongodb://database:27017
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: gemma2:9b
      VISION_API_SECRET_TOKEN: ${VISION_API_SECRET_TOKEN:?VISION_API_SECRET_TOKEN is required (see .env.example)}
    networks:
      - falatexto-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assis_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - database
      - vision-engine
      - ollama
    environment:
      MONGO_URI: mongodb://database:27017
      MONGO_DB_NAME: assis_db
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      VISION_ENGINE_URL: http://vision-engine:8001
      VISION_API_SECRET_TOKEN: ${VISION_API_SECRET_TOKEN:?VISION_API_SECRET_TOKEN is required (see .env.example)}
    networks:
      - falatexto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assis_frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VISION_API_SECRET_TOKEN: ${VISION_API_SECRET_TOKEN:?VISION_API_SECRET_TOKEN is required (see .env.example)}
      ADMIN_PIN: ${ADMIN_PIN:?ADMIN_PIN is required (see .env.example)}
    depends_on:
      - api
    networks:
      - falatexto-network

  proxy:
    image: nginx:alpine
    container_name: assis_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy_logs:/var/log/nginx
    depends_on:
      - frontend
      - api
    networks:
      - falatexto-network

volumes:
  mongo_data:
  proxy_logs:
  ollama_data:

networks:
  falatexto-network:
    driver: bridge