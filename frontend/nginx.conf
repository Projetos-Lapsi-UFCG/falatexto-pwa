server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Disable caching for the service worker manifest so updates are picked up immediately
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular service worker script — must not be cached
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Runtime config — regenerated at container startup; never cache it
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # All other routes — hand off to Angular's client-side router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively (hashed filenames from ng build)
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
