
services:
  database:
    image: mongo:latest
    container_name: assis_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: assis_db
    volumes:
      - ./scripts/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
      - mongo_data:/data/db
    networks:
      - falatexto-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    container_name: assis_api
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://database:27017/?replicaSet=rs0
      MONGO_DB_NAME: assis_db
      SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-90}
    networks:
      - falatexto-network

volumes:
  mongo_data:

networks:
  falatexto-network:
    driver: bridge
