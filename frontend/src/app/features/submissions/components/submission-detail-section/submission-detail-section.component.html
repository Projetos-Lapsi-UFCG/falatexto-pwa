@if (entries.length) {
  <section class="detail-section">
    <h3 class="detail-section-title">{{ titleKey | translate }}</h3>
    <dl class="detail-grid">
      @for (entry of entries; track entry.key) {
        <dt>{{ entry.label }}</dt>
        <dd>{{ entry.value | displayValue }}</dd>
      }
    </dl>
  </section>
}
