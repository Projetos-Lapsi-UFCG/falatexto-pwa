services:
  database:
    image: mongo:latest
    container_name: assis_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: assis_db
    volumes:
      - ./backend/scripts/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
      - mongo_data:/data/db
    networks:
      - falatexto-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "printjson(db.adminCommand({ping:1}))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assis_api
    ports:
      - "8000:8000"
    depends_on:
      - database
    extra_hosts:
      - "localhost:172.17.0.1"
    environment:
      MONGO_URI: mongodb://database:27017
      MONGO_DB_NAME: assis_db
      OLLAMA_HOST: http://172.17.0.1:11434
      OLLAMA_MODEL: llama3.1:8b
      VISION_ENGINE_URL: http://vision-engine:8001
    networks:
      - falatexto-network

  vision-engine:
    build:
      context: ./backend/vision-engine
      dockerfile: Dockerfile
    container_name: assis_vision_engine
    ports:
      - "8001:8001"
    depends_on:
      - database
    environment:
      MONGO_URI: mongodb://database:27017
      # Requer Ollama rodando no HOST (fora do Docker) na porta 11434,
      # com o modelo abaixo já baixado: `ollama pull gemma:7b`.
      OLLAMA_HOST: http://172.17.0.1:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_URL: http://172.17.0.1:11434
      OLLAMA_MODEL: llama3.1:8b
    networks:
      - falatexto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assis_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - falatexto-network

  proxy:
    image: nginx:alpine
    container_name: assis_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy_logs:/var/log/nginx
    depends_on:
      - frontend
      - api
    networks:
      - falatexto-network

volumes:
  mongo_data:
  proxy_logs:

networks:
  falatexto-network:
    driver: bridge