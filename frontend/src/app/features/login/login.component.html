<div class="login-wrapper min-h-screen bg-neutral-50 flex items-center justify-center p-6">
  <div [@scaleIn] class="login-card">
    <div class="login-header">
      <h1 class="login-title">{{ 'LOGIN.TITLE' | translate }}</h1>
      <p class="login-subtitle">{{ 'LOGIN.SUBTITLE' | translate }}</p>
    </div>

    <div class="login-form">

      <p class="role-label">{{ 'LOGIN.CHOOSE_ROLE' | translate }}</p>
      <div class="role-buttons">
        <button mat-stroked-button type="button" class="role-btn" (click)="loginAsGuest()">
          {{ 'LOGIN.USER_TYPE_GUEST' | translate }}
        </button>
        @if (showPin) {
          <button mat-raised-button color="primary" type="button" class="role-btn" (click)="selectAdmin()">
            {{ 'LOGIN.USER_TYPE_ADMIN' | translate }}
          </button>
        } @else {
          <button mat-stroked-button type="button" class="role-btn" (click)="selectAdmin()">
            {{ 'LOGIN.USER_TYPE_ADMIN' | translate }}
          </button>
        }
      </div>

      @if (showPin) {
        <form [@scaleIn] (ngSubmit)="handleLogin()" class="admin-form">
          <div class="pin-section">
            <p class="pin-label">{{ 'LOGIN.PIN_LABEL' | translate }}</p>
            <app-pin-input (pinChange)="onPinChange($event)" />
          </div>

          <button mat-raised-button color="primary" type="submit" class="login-btn">
            {{ 'LOGIN.SIGN_IN' | translate }}
          </button>
        </form>
      }

    </div>
  </div>
</div>
